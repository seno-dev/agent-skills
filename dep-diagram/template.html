*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
#page{min-width:1280px;padding:0 20px}
h1{font-size:20px;margin:0;padding-top:16px}
/* legend / filter */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin:10px 0}
.filter{display:flex;gap:8px}
.filter button{font:inherit;font-size:13.5px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.filter button[style*="--mc"]{border-color:color-mix(in srgb,var(--mc) 55%,var(--line))}
.filter button[style*="--mc"]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc);margin-right:6px}
.filter button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.filter .n{opacity:.6;margin-left:4px;font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text2);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.legend .ln{display:inline-block;width:22px;height:0;border-top:2.5px solid;margin-right:5px;vertical-align:3px}
.legend .sep{color:var(--text3)}
/* board: two max-content panes + a middle gutter; only the board scrolls sideways */
#scroll{overflow-x:auto;overflow-y:hidden;display:grid;justify-content:safe center}
#scroll>.colhd,#scroll>#board{width:max-content}
.colhd{margin:8px 40px 0;display:grid;grid-template-columns:minmax(360px,1fr) clamp(160px,12vw,220px) minmax(360px,1fr)}
.colhd div{font-size:12px;color:var(--text3);padding:0 2px 4px}
#board{position:relative;margin:0 40px;display:grid;grid-template-columns:minmax(360px,1fr) clamp(160px,12vw,220px) minmax(360px,1fr);align-items:start;padding-bottom:30px}
#colL{grid-column:1}#colR{grid-column:3}
#colL,#colR{zoom:.9}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3}
/* directory and file cards */
.dir{border:1px solid var(--dirline);border-radius:10px;background:transparent;margin:0 0 8px;overflow:hidden}
.dir .dir{margin:6px 0 0}
.dir>.dh{display:flex;align-items:center;gap:6px;padding:6px 20px}
.dir>.dh .nm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700}
.dir>.dh .ct{margin-left:auto;color:var(--text3);font-size:11.5px}
.dir>.db{padding:0 48px 8px}
.file{border:1px solid var(--line);border-left-width:5px;border-left-color:var(--mc,var(--line));border-radius:8px;background:var(--zt,var(--card));margin:6px 0 0;cursor:pointer;transition:opacity .12s}
.file.sel{outline:2px solid var(--text);outline-offset:0}
.file.act{outline:1.5px solid var(--text3)}
.file.dim,.file.fdim{opacity:.28}
.fh{display:flex;flex-wrap:nowrap;white-space:nowrap;align-items:center;gap:4px 7px;padding:6px 9px 4px;cursor:pointer}
.fh>*{flex:none}
.fh .fnm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700}
.badge{font-size:10.5px;line-height:1;padding:3px 8px;border-radius:999px;white-space:nowrap;font-weight:600;background:var(--mb,var(--chakra-colors-gray-muted));color:var(--mf,var(--chakra-colors-gray-fg))}
.badge.mk{background:none;padding:0;font-size:12px;font-weight:700}
.badge.muted{background:var(--zb,var(--chakra-colors-gray-muted));color:var(--zf,var(--chakra-colors-gray-fg))}
.badge.test{background:var(--chakra-colors-blue-muted);color:var(--chakra-colors-blue-fg)}
.zt{margin-left:auto;font-size:10.5px;line-height:1;padding:3px 8px;border-radius:999px;font-weight:600;background:var(--zb,var(--chakra-colors-gray-muted));color:var(--zf,var(--chakra-colors-gray-fg))}
.file>.sm,.fns{contain:inline-size} /* the card width comes from the file-name row only */
.file>.sm{font-size:11.5px;line-height:1.5;color:var(--text2);padding:0 9px 4px}
.fns{padding:0 6px 6px}
.fn{display:flex;align-items:baseline;gap:6px;padding:2px 6px;border-radius:5px;font-size:12px;min-width:0}
.fn .mk{color:var(--text3);font-size:10px;flex:none;width:11px;text-align:center}
.fn .nm{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto;cursor:pointer}
.fn .nm:hover{background:rgba(127,127,127,.2);border-radius:3px}
.fn .kd{margin-left:auto;color:var(--text3);font-size:10.5px;white-space:nowrap;flex:none}
.fn.sel{background:var(--sel);box-shadow:inset 0 0 0 1.5px var(--text)}
.fn.act{background:rgba(127,127,127,.2)}
/* detail panel */
#panel{position:fixed;left:20px;right:20px;bottom:0;z-index:5;display:none;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);padding:10px 40px 10px 14px;max-height:40vh;overflow:auto}
#spacer{height:calc(40vh + 16px)}
#panel.on{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
#panel h3{margin:0 0 4px;font-size:12px;color:var(--text3);font-weight:600}
#panel .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#panel .pp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;word-break:break-all}
#panel .sm{font-size:13px;color:var(--text2);margin:2px 0 6px}
#panel .x{position:absolute;top:8px;right:10px;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:none;color:var(--text2);font:inherit;font-size:20px;line-height:22px;text-align:center;cursor:pointer}
#panel .x:hover{background:var(--bg2);color:var(--text)}
.it{padding:4px 6px;border-radius:6px;border-bottom:1px solid var(--line2);cursor:pointer}
.it.cur{background:var(--sel)}
.it .in{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700}
.it .k{font-size:11px;color:var(--text3);margin-left:6px}
.it .tx{font-size:12.5px;color:var(--text2)}
.lg{border:1px solid var(--line);border-left:4px solid var(--mc,var(--line));border-radius:8px;background:var(--zt,var(--bg2));padding:4px 8px 6px;margin:0 0 6px}
.lh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lf{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:var(--text);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.lf:hover{text-decoration:underline}
.ll{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.lk{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;padding:2px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer}
.lk:hover{background:var(--bg2)}
.ex{font-size:11.5px;color:var(--text3);margin-top:6px}
.emp{font-size:12.5px;color:var(--text3)}
</style>
</head>
<body>
<div id="page">
<h1 id="title" hidden></h1>
<div class="bar">
  <div class="filter" id="filter" role="group"></div>
  <div class="legend" id="legend"></div>
</div>
<div id="scroll"><div class="colhd" id="colhd"><div id="hdL"></div><div></div><div id="hdR"></div></div>
<div id="board">
  <div id="colL"></div><div id="colR"></div>
  <svg id="edges" aria-hidden="true"></svg>
</div></div>
<div id="spacer" aria-hidden="true"></div>
<div id="panel" aria-live="polite"></div>
</div>
<script>
"use strict";
/* ============================================================================
   1. CONFIG — the only layout rule tied to a directory name, plus UI strings and geometry
   ========================================================================== */
var CONFIG = {
  rightDir: "features",   // files under <rightDir>/ go to the right pane; everything else to the left
  edgeColors: 9,             // number of --ecN colours in the CSS cycle (Chakra red, orange, yellow, green, teal, cyan, blue, purple, pink)
  stub: 48,                  // horizontal run out of a card before a cross-pane curve starts
  fan: 28,                   // how far past the nearest file a bundle junction sits
  laneGap: 9,                // spacing of dotted lanes inside a directory card
  corner: 8,                 // corner radius of dotted orthogonal lines
  tapLead: 24,               // how far (px) past its own row a solid bundle's branch joins its trunk (and short of its row it leaves it)
  anchorInset: 18,           // file-level out/in anchors sit this far below the card top / above the card bottom
  shift: 4,                  // out/in anchors on function rows are shifted up/down by this
  pad: 32, midMin: 128, pagePad: 20   // outer margin = max(pad, midMin, line overhang + pad); pagePad = #page side padding
};
var T = {                    // UI strings
  all: "すべて", filterLabel: "変更の種類で絞り込む", others: "以外", files: "ファイル",
  uses: "使う", usedBy: "使われる", weak: "テスト",
  test: "テスト", wholeFile: "全体",
  none: "–", clear: "選択を外す", extra: "図に出していない import: "
};

/* ============================================================================
   2. DATA — replace this object to show another project
   ----------------------------------------------------------------------------
   DATA = {
     title?:      string                    page heading (also document.title)
     marks?:      [{label, color, badge?}]  file status labels; badge = short text shown on cards (e.g. A / M / D); no badge -> no badge on cards (filter chips always show the full label); color = Chakra colour scheme name (git-like: added green, modified yellow, deleted red, unchanged gray) or any CSS colour.
                                            A filter chip is shown only for labels some file uses
     zones?:      [{id, label, color}]      optional file roles; card tint = that Chakra scheme's subtle colour (a file without zone is untinted)
     tagSymbols?: {tag: symbol}             one-char prefix on a function row per fn.tag
     files: [{
       path:     "dir/sub/file.ext"         unique; the directory tree is derived from the paths
       summary?: string                     one line shown in the card
       mark?:    one of DATA.marks          left border colour, badge, filter
       zone?:    one of DATA.zones[].id     card tint
       test?:    true                       "test" badge; its edges are drawn only when selected
       extra?:   string                     note shown in the detail panel
       fns?: [{ name, id?, kind?, note?, tag? }]   functions / exports shown as rows (id defaults to name)
     }]
     edges: [[from, to, {weak?:true}?]]     from/to = "path" or "path#fnId"; "uses" direction from → to.
                                            weak (or from a test file) = dashed, drawn only when an end is selected
   }
   ========================================================================== */
/* DATA:BEGIN — replace everything between BEGIN and END with the real diff */
var DATA = {
  title: "Example — what the change touches",
  marks: [{label: "added", color: "green", badge: "A"}, {label: "modified", color: "yellow", badge: "M"}, {label: "deleted", color: "red", badge: "D"}, {label: "untouched", color: "gray"}],
  tagSymbols: {add: "+", mod: "~", del: "-"},
  zones: [{id: "entry", label: "Entry", color: "teal"}, {id: "logic", label: "Logic", color: "purple"}],
  files: [
    {path: "src/main.ext", mark: "modified", zone: "entry", summary: "Entry point.",
     fns: [{name: "run", kind: "function", note: "Starts the app."}]},
    {path: "src/util.ext", mark: "untouched", zone: "logic", summary: "Shared helpers.",
     fns: [{name: "format", kind: "function", note: "Formats a value."}]},
    {path: "features/feature-a/core.ext", mark: "added", zone: "logic", summary: "Core of the new feature.",
     fns: [{name: "compute", kind: "function", note: "Does the work."}]},
    {path: "features/feature-a/core.test.ext", mark: "added", test: true, summary: "Tests for core.",
     fns: [{name: "core suite", id: "suite", kind: "test", note: "Basic cases."}]}
  ],
  edges: [
    ["src/main.ext#run", "features/feature-a/core.ext#compute"],
    ["features/feature-a/core.ext#compute", "src/util.ext#format"],
    ["features/feature-a/core.test.ext", "features/feature-a/core.ext#compute"]
  ]
};
/* DATA:END */

/* ============================================================================
   3. MODEL — indexes, resolved edges, directory tree (derived from paths)
   ========================================================================== */
var FILES = DATA.files, MARKS = DATA.marks || [], MARKCOLOR = {}, ZONES = DATA.zones || [], TAGS = DATA.tagSymbols || {};
var MAP = {}, EDGES = [], TREE = {name: "", path: "", kids: {}, file: null};

function base(p) { return p.slice(p.lastIndexOf("/") + 1); }
function dirOf(p) { var i = p.lastIndexOf("/"); return i < 0 ? "" : p.slice(0, i); }
function side(p) { return p.indexOf(CONFIG.rightDir + "/") === 0 ? "R" : "L"; }
function fnKey(it) { return it.id || it.name; }
// a colour key is a Chakra colour scheme name (gray, red, orange, yellow, green, teal, blue, cyan, purple, pink) -> its semantic tokens;
// any other string is used as a raw CSS colour. c = border/dot, f = text, s = subtle background (card tint), m = muted background (badges)
function scheme(c) {
  if (/^[a-z]+$/.test(c)) { var v = function (k) { return "var(--chakra-colors-" + c + "-" + k + ")"; }; return {c: v("border"), f: v("fg"), s: v("subtle"), m: v("muted")}; }
  return {c: c, f: c, s: "color-mix(in srgb," + c + " 20%,var(--card))", m: "color-mix(in srgb," + c + " 25%,var(--card))"};
}
var MARKFG = {}, MARKBG = {}, MARKBADGE = {}, ZMAP = {};
MARKS.forEach(function (m) { var k = scheme(m.color); MARKCOLOR[m.label] = k.c; MARKFG[m.label] = k.f; MARKBG[m.label] = k.m; if (m.badge) MARKBADGE[m.label] = m.badge; });
ZONES.forEach(function (z) { ZMAP[z.id] = {label: z.label, k: scheme(z.color || "gray")}; });
// which pane a top-level tree node belongs to
function paneOf(n) { return side(n.file ? n.path : n.path + "/"); }

FILES.forEach(function (f) {
  if (MAP[f.path]) throw new Error("duplicate path " + f.path);
  f.fns = f.fns || [];
  MAP[f.path] = f;
  var parts = f.path.split("/"), cur = TREE;
  parts.forEach(function (part, i) {
    if (!cur.kids[part]) cur.kids[part] = {name: part, path: parts.slice(0, i + 1).join("/"), kids: {}, file: null};
    cur = cur.kids[part];
    if (i === parts.length - 1) cur.file = f;
  });
});

// "path" or "path#fnId" -> {path, i} (i = null for the file itself)
function resolveRef(ref) {
  var h = ref.indexOf("#"), path = h < 0 ? ref : ref.slice(0, h), f = MAP[path];
  if (!f) throw new Error("edge refers to unknown file " + path);
  if (h < 0) return {path: path, i: null};
  var id = ref.slice(h + 1), i = f.fns.map(fnKey).indexOf(id);
  if (i < 0) throw new Error("no function " + id + " in " + path);
  return {path: path, i: i};
}
DATA.edges.forEach(function (e) {
  var a = resolveRef(e[0]), b = resolveRef(e[1]);
  EDGES.push({a: a.path, ai: a.i, b: b.path, bi: b.i, weak: !!(e[2] && e[2].weak) || !!MAP[a.path].test});
});

function nkids(n) { return Object.keys(n.kids); }
function fcount(n) { if (n.file) return 1; return nkids(n).reduce(function (t, k) { return t + fcount(n.kids[k]); }, 0); }
// two paths are "same hierarchy" when one directory contains (or equals) the other
function sameHier(a, b) { var x = dirOf(a), y = dirOf(b); return x === y || x.indexOf(y + "/") === 0 || y.indexOf(x + "/") === 0; }
function commonDir(a, b) { var x = dirOf(a), y = dirOf(b); return x.length <= y.length ? x : y; }

/* ============================================================================
   4. STATE — filter, selection, active set
   ========================================================================== */
var state = {filter: T.all, sel: null};   // sel: {path, i} (i = null for the whole file)
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
function matches(f) { return state.filter === T.all || f.mark === state.filter; }
function visibleEdges() { var s = state.sel; return EDGES.filter(function (e) { return !e.weak || (s && (e.a === s.path || e.b === s.path)); }); }
function activeSet() {
  var s = state.sel; if (!s) return null;
  var es = visibleEdges(), hit;
  function touches(e) { return e.a === s.path || e.b === s.path; }
  if (s.i != null) {
    hit = es.filter(function (e) { return (e.a === s.path && e.ai === s.i) || (e.b === s.path && e.bi === s.i); });
    if (!hit.length) hit = es.filter(touches);   // no function-level edge: show the file's edges
  } else hit = es.filter(touches);
  var act = {edges: hit, files: {}, fns: {}};
  act.files[s.path] = 1;
  hit.forEach(function (e) {
    act.files[e.a] = 1; act.files[e.b] = 1;
    if (e.ai != null) act.fns[e.a + "#" + e.ai] = 1;
    if (e.bi != null) act.fns[e.b + "#" + e.bi] = 1;
  });
  return act;
}
// filter change: layout is unchanged, so restyle in place (chip state, card dimming, edge / branch / triangle opacity); with a selection, fall back to a full render
function setFilter(k) {
  state.filter = k;
  if (state.sel) { render(); return; }
  [].forEach.call($("filter").querySelectorAll("button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-f") === k)); });
  [].forEach.call(document.querySelectorAll(".file[data-path]"), function (c) { c.classList.toggle("fdim", !matches(MAP[c.getAttribute("data-path")])); });
  [].forEach.call($("edges").querySelectorAll("[data-mk]"), function (el) {
    if (shownByFilter(el.getAttribute("data-mk"))) el.removeAttribute("opacity"); else el.setAttribute("opacity", "0.08");
  });
}
function setSel(p, i) { state.sel = p ? {path: p, i: i == null ? null : i} : null; render(); }

/* ============================================================================
   5. RENDER — title, filter, legend, directory/file cards, detail panel
   ========================================================================== */
function renderChrome() {
  if (DATA.title) { $("title").hidden = false; $("title").textContent = DATA.title; document.title = DATA.title; }
  $("filter").setAttribute("aria-label", T.filterLabel);
  var counts = {};
  FILES.forEach(function (f) { counts[f.mark] = (counts[f.mark] || 0) + 1; });
  $("filter").innerHTML = [T.all].concat(MARKS.map(function (m) { return m.label; }).filter(function (k) { return counts[k]; })).map(function (k) {
    return '<button data-f="' + esc(k) + '" aria-pressed="' + (state.filter === k) + '"' + (MARKCOLOR[k] ? ' style="--mc:' + MARKCOLOR[k] + '"' : '') + '>' + esc(k) + '<span class="n">' + (k === T.all ? FILES.length : counts[k] || 0) + '</span></button>';
  }).join("");
}
function renderLegend() {
  var sw = function (bg, label) { return '<span><i style="background:' + bg + '"></i>' + esc(label) + '</span>'; };
  var ln = function (style, label) { return '<span><span class="ln" style="' + style + '"></span>' + esc(label) + '</span>'; };
  var sep = '<span class="sep">|</span>', parts = [];
  if (ZONES.length) parts.push(ZONES.map(function (z) { return sw(ZMAP[z.id].k.s, z.label); }).join(""));
  parts.push(ln("border-color:var(--out)", T.uses) + ln("border-color:var(--in)", T.usedBy) + ln("border-top-style:dashed;border-color:var(--edge)", T.weak));
  $("legend").innerHTML = parts.join(sep);
}
function paneHeaders() {
  $("hdL").textContent = CONFIG.rightDir + "/ " + T.others;
  $("hdR").textContent = CONFIG.rightDir + "/";
}

function styleVars(f) {
  var m = MARKCOLOR[f.mark], z = ZMAP[f.zone];
  return (m ? "--mc:" + m + ";--mf:" + MARKFG[f.mark] + ";--mb:" + MARKBG[f.mark] + ";" : "") + (z ? "--zt:color-mix(in srgb," + z.k.s + " 50%,var(--card));--zf:" + z.k.f + ";--zb:" + z.k.m + ";" : "");
}
function badges(f) {
  var z = ZMAP[f.zone];
  return {
    mark: MARKBADGE[f.mark] ? '<span class="badge mk" title="' + esc(f.mark) + '">' + esc(MARKBADGE[f.mark]) + '</span>' : "",
    test: f.test ? '<span class="badge test">' + T.test + '</span>' : "",
    zone: z ? z.label : ""
  };
}
function fileHtml(f, act) {
  var cls = "file", s = state.sel, isSel = s && s.path === f.path;
  if (isSel) cls += " sel";
  if (act) { if (act.files[f.path] && !isSel) cls += " act"; else if (!act.files[f.path]) cls += " dim"; }
  if (!matches(f)) cls += " fdim";
  var b = badges(f);
  var h = '<div class="' + cls + '" data-path="' + esc(f.path) + '" style="' + styleVars(f) + '">';
  h += '<div class="fh" title="' + esc(f.path + "\n" + (f.summary || "")) + '"><span class="fnm">' + esc(base(f.path)) + '</span>' + b.mark + b.test + (b.zone ? '<span class="zt">' + esc(b.zone) + '</span>' : "") + '</div>';
  if (f.summary) h += '<div class="sm">' + esc(f.summary) + '</div>';
  h += '<div class="fns">';
  f.fns.forEach(function (it, i) {
    var c = "fn";
    if (isSel && s.i === i) c += " sel"; else if (act && act.fns[f.path + "#" + i]) c += " act";
    var kind = it.kind || "";
    h += '<div class="' + c + '" data-fn="' + esc(f.path) + '" data-i="' + i + '" title="' + esc(it.name + (kind ? "（" + kind + "）" : "")) + '"><span class="mk">' + esc(TAGS[it.tag] || "") + '</span><span class="nm">' + esc(it.name) + '</span><span class="kd">' + esc(kind) + '</span></div>';
  });
  return h + '</div></div>';
}
// single-child directory chains are shown as one card: a/b/c/
function dirHtml(n, act) {
  var name = n.name;
  while (!n.file && nkids(n).length === 1 && !n.kids[nkids(n)[0]].file) { n = n.kids[nkids(n)[0]]; name += "/" + n.name; }
  var keys = nkids(n).sort(function (a, b) {
    var ad = n.kids[a].file ? 1 : 0, bd = n.kids[b].file ? 1 : 0;
    return ad !== bd ? ad - bd : a.localeCompare(b);   // directories first, then alphabetical
  });
  var inner = keys.map(function (k) { return nodeHtml(n.kids[k], act); }).join("");
  return '<div class="dir" data-dirbox="' + esc(n.path) + '"><div class="dh"><span class="nm">' + esc(name) + '/</span><span class="ct">' + fcount(n) + ' ' + T.files + '</span></div><div class="db">' + inner + '</div></div>';
}
function nodeHtml(n, act) { return n.file ? fileHtml(n.file, act) : dirHtml(n, act); }

// one small card per counterpart file; inside it the counterpart functions involved (or the whole-file label when the edge is file-level)
function linkGroups(items) {
  var order = [], by = {};
  items.forEach(function (it) {
    if (!by[it.p]) { by[it.p] = {}; order.push(it.p); }
    by[it.p][it.i == null ? "" : it.i] = 1;
  });
  return order.map(function (p) {
    var f = MAP[p], b = badges(f), idx = Object.keys(by[p]).map(function (k) { return k === "" ? null : +k; });
    idx.sort(function (x, y) { return (x == null ? -1 : x) - (y == null ? -1 : y); });
    return '<div class="lg" style="' + styleVars(f) + '"><div class="lh"><button class="lf" data-pf="' + esc(p) + '" title="' + esc(p) + '">' + esc(base(p)) + '</button>' + b.mark + b.test + '</div><div class="ll">' +
      idx.map(function (i) {
        return '<button class="lk" data-pf="' + esc(p) + '"' + (i != null ? ' data-pi="' + i + '"' : '') + '>' + esc(i != null ? fnKey(f.fns[i]) : T.wholeFile) + '</button>';
      }).join("") + '</div></div>';
  }).join("");
}
function renderPanel(act) {
  var el = $("panel"), s = state.sel;
  if (!s) { el.className = ""; el.innerHTML = ""; return; }
  var f = MAP[s.path], b = badges(f);
  var h = '<div style="' + styleVars(f) + '"><div class="ph"><span class="pp">' + esc(f.path) + '</span>' + b.mark + b.test + (b.zone ? '<span class="badge muted">' + esc(b.zone) + '</span>' : "") + '</div>';
  if (f.summary) h += '<div class="sm">' + esc(f.summary) + '</div>';
  f.fns.forEach(function (it, i) {
    h += '<div class="it' + (s.i === i ? ' cur' : '') + '" data-pf="' + esc(f.path) + '" data-pi="' + i + '"><span class="in">' + esc(it.name) + '</span><span class="k">' + esc((it.kind || "") + (it.tag ? "・" + it.tag : "")) + '</span><div class="tx">' + esc(it.note || "") + '</div></div>';
  });
  if (f.extra) h += '<div class="ex">' + T.extra + esc(f.extra) + '</div>';
  h += '</div>';
  var out = [], inn = [];
  act.edges.forEach(function (e) {
    if (e.a === s.path) out.push({p: e.b, i: e.bi}); else inn.push({p: e.a, i: e.ai});
  });
  var none = '<div class="emp">' + T.none + '</div>';
  h += '<div><h3>' + T.uses + '</h3>' + (linkGroups(out) || none) + '</div>';
  h += '<div><h3>' + T.usedBy + '</h3>' + (linkGroups(inn) || none) + '</div>';
  el.className = "on"; el.innerHTML = h + '<button class="x" data-clear="1" aria-label="' + esc(T.clear) + '" title="' + esc(T.clear) + '">×</button>';
}
function render() {
  var act = activeSet(), L = "", R = "";
  renderChrome();
  nkids(TREE).sort().forEach(function (k) {
    var n = TREE.kids[k], h = nodeHtml(n, act);
    if (paneOf(n) === "R") R += h; else L += h;
  });
  $("colL").innerHTML = L; $("colR").innerHTML = R;
  renderPanel(act);
  drawEdges();
}

/* ============================================================================
   6. LAYOUT — card anchors on the board
   ========================================================================== */
var ctx;   // per-draw context: {br: board rect, glanes: dotted-lane occupancy}
// kind "out" leaves near the card top, "in" arrives near the bottom; function rows shift by ±shift.
// outer: same-pane lines use the pane's outer edge instead of the edge facing the middle gutter.
function anchor(kind, path, i, outer) {

  function hnd(u, P1, P2) { var n = Math.hypot(u.x, u.y) || 1, L = 0.45 * Math.hypot(P2.x - P1.x, P2.y - P1.y); return {x: u.x / n * L, y: u.y / n * L}; }
  var br = {br: 1, dash: dash};
  srcs.forEach(function (f) {
    var A = SA[f], A2x = A.x + sa * stubOf(A, Js, sa), op = gs.filter(function (g) { return g.a === f; });
    if (srcs.length > 1) {
      var q = hnd(v, {x: A2x, y: A.y}, Js);
      h += pth('M' + pt(A.x, A.y) + ' H' + A2x + ' C' + pt(sp(A2x + sa * Math.min(bk2(Math.abs(Js.y - A.y)), 0.45 * Math.hypot(Js.x - A2x, Js.y - A.y)), A2x, Js.x), A.y) + ' ' + pt(sp(Js.x - q.x, A2x, Js.x), Js.y - q.y) + ' ' + pt(Js.x, Js.y), cv, op, br);
    } else h += pth('M' + pt(A.x, A.y) + ' H' + Js.x, cv, op, br);
  });
  var tc1 = Js.x + (srcs.length > 1 ? v.x : sa * k), tc2 = Jt.x + (tgts.length > 1 ? w.x : sb * k);
  if (!inPane) { tc1 = sp(tc1, Js.x, Jt.x); tc2 = sp(tc2, Js.x, Jt.x); }
  h += pth('M' + pt(Js.x, Js.y) + ' C' + pt(tc1, Js.y + (srcs.length > 1 ? v.y : 0)) + ' ' + pt(tc2, Jt.y + (tgts.length > 1 ? w.y : 0)) + ' ' + pt(Jt.x, Jt.y), cv, gs, {dash: dash});
  tgts.forEach(function (f) {
    var B = TB[f], B2x = B.x + sb * stubOf(B, Jt, sb), op = gs.filter(function (g) { return g.b === f; });
    if (tgts.length > 1) {
      var q = hnd(w, {x: B2x, y: B.y}, Jt);
      h += pth('M' + pt(Jt.x, Jt.y) + ' C' + pt(sp(Jt.x - q.x, Jt.x, B2x), Jt.y - q.y) + ' ' + pt(sp(B2x + sb * Math.min(bk2(Math.abs(B.y - Jt.y)), 0.45 * Math.hypot(Jt.x - B2x, Jt.y - B.y)), Jt.x, B2x), B.y) + ' ' + pt(B2x, B.y) + ' H' + B.x, cv, op, br);
    } else h += pth('M' + pt(Jt.x, Jt.y) + ' H' + B.x, cv, op, br);
  });
  return h;
}

// ---- selection: every visible edge at function level; edges touching the selection are drawn last (on top)
function selectionHtml(act) {
  var s = state.sel, rest = [], top = [];
  visibleEdges().forEach(function (e) {
    var isAct = act.edges.indexOf(e) >= 0;
    if (!isAct && s.i == null) return;   // a file is selected: other arrows hidden
    var inPane = side(e.a) === side(e.b), A = ancOut(e.a, e.ai, inPane), B = ancIn(e.b, e.bi, inPane), rt = route(e.a, e.b, A, B);
    var op = isAct ? 1 : 0.05;
    if (!isAct && (!matches(MAP[e.a]) || !matches(MAP[e.b]))) op = Math.min(op, 0.08);
    var cv = isAct ? (e.a === s.path ? "var(--out)" : "var(--in)") : "var(--edge)";
    (isAct ? top : rest).push(pth(rt.d, cv, op, {dash: e.weak ? WEAK : (rt.same ? DOT : null)}));
  });
  return rest.concat(top);
}

// the gap between the panes: l = right-most card edge of the left pane, r = left-most card edge of the right pane (null when a pane is empty)
function gutter() {
  var br = board_().getBoundingClientRect(), l = -Infinity, r = Infinity;
  [].forEach.call(document.querySelectorAll("#colL .file"), function (c) { l = Math.max(l, c.getBoundingClientRect().right - br.left); });
  [].forEach.call(document.querySelectorAll("#colR .file"), function (c) { r = Math.min(r, c.getBoundingClientRect().left - br.left); });
  return l < r && isFinite(l) && isFinite(r) ? {l: l, r: r, mid: (l + r) / 2} : null;
}
function board_() { return $("board"); }
// x of a lane just outside every card of the pane, on side sd (-1 left, +1 right)
function paneLaneX(path, sd) {
  var pane = side(path) === "L" ? "#colL" : "#colR", x = sd < 0 ? Infinity : -Infinity;
  [].forEach.call(document.querySelectorAll(pane + " .file"), function (c) {
    var r = c.getBoundingClientRect(); x = sd < 0 ? Math.min(x, r.left - ctx.br.left) : Math.max(x, r.right - ctx.br.left);
  });
  return x + sd * 18;
}
function drawEdges() {
  var board = $("board"), svg = $("edges"), W = board.scrollWidth, H = board.scrollHeight;
  ctx = {br: board.getBoundingClientRect(), glanes: {}, gut: gutter()};
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.innerHTML = (state.sel ? selectionHtml(activeSet()) : overviewHtml()).join("");
  decorate(svg);
  var hd = $("colhd"); hd.style.gridTemplateColumns = getComputedStyle(board).gridTemplateColumns; hd.style.width = board.offsetWidth + "px";
  fitMargins(board, svg);
}

/* ============================================================================
   8. DECORATE — mid arrows and endpoint triangles
   Mid arrows sit at 1/3 and 2/3 of the non-horizontal part of a trunk (not on branches);
   where a line meets a card border a triangle in the line direction is drawn on the border
   (hollow = leaves the card, filled = enters it).
   ========================================================================== */
function decorate(svg) {
  var br = ctx.br, out = [];
  var rects = [].map.call(document.querySelectorAll(".file"), function (c) {
    var r = c.getBoundingClientRect();
    return {l: r.left - br.left, r: r.right - br.left, t: r.top - br.top, b: r.bottom - br.top};
  });
  function onCard(p) { return rects.some(function (r) { return (Math.abs(p.x - r.l) < 1.5 || Math.abs(p.x - r.r) < 1.5) && p.y >= r.t - 1 && p.y <= r.b + 1; }); }
  function tri(p, a, cv, op, sz, mode, mk) {
    var hx = mode ? sz * 0.74 : sz;
    var style = mode === "out" ? 'fill="var(--bg)" stroke="' + cv + '" stroke-width="1.1" stroke-linejoin="round"'
      : mode === "in" ? 'fill="' + cv + '" stroke="' + cv + '" stroke-width="1.1" stroke-linejoin="round"' : 'fill="' + cv + '"';
    return '<path d="M' + (-hx) + ',' + (-sz * 0.85) + ' L' + hx + ',0 L' + (-hx) + ',' + (sz * 0.85) + ' z" ' + style + (mk ? ' data-mk="' + mk + '"' : '') + (op < 1 ? ' opacity="' + op + '"' : '') + ' transform="translate(' + p.x + ',' + p.y + ') rotate(' + a + ')"/>';
  }
  function ang(el, l1, l2) { var p = el.getPointAtLength(l1), q = el.getPointAtLength(l2); return Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI; }
  [].forEach.call(svg.querySelectorAll("path[stroke]"), function (el) {
    var cv = el.getAttribute("stroke"), op = +(el.getAttribute("opacity") || 1), mk = el.getAttribute("data-mk"), L = el.getTotalLength();
    if (!el.hasAttribute("data-br") && L > 20) {
      var N = Math.max(8, Math.ceil(L / 4)), t0 = null, t1 = null;
      for (var k = 0; k < N; k++) {
        var la = L * k / N, lb = L * (k + 1) / N, p = el.getPointAtLength(la), q = el.getPointAtLength(lb);
        if (Math.abs(q.y - p.y) > 0.35 * Math.abs(q.x - p.x)) { if (t0 == null) t0 = la; t1 = lb; }
      }
      if (t0 != null && t1 - t0 > 30) [1 / 3, 2 / 3].forEach(function (t) { var l = t0 + (t1 - t0) * t; out.push(tri(el.getPointAtLength(l), ang(el, l, Math.min(L, l + 1)), cv, op, 4, null, mk)); });
    }
    var s0 = el.getPointAtLength(0), s1 = el.getPointAtLength(L);
    if (onCard(s0)) out.push(tri(s0, ang(el, 0, Math.min(L, 2)), cv, op, 4.5, "out", mk));
    if (onCard(s1)) out.push(tri(s1, ang(el, Math.max(0, L - 2), L), cv, op, 4.5, "in", mk));
  });
  svg.insertAdjacentHTML("beforeend", out.join(""));
}

/* ============================================================================
   9. FIT — equal side / middle margins, pushed out by the outermost line; redraws only when they change
   ========================================================================== */
var fitting = 0;
function fitMargins(board, svg) {
  if (fitting >= 4) return;
  var bb = svg.getBBox(), W = board.clientWidth, cs = getComputedStyle(board), c = CONFIG;
  var ml = parseFloat(cs.marginLeft), mr = parseFloat(cs.marginRight);
  var gw = ctx.gut ? ctx.gut.r - ctx.gut.l : 0, wide = ctx.needGap ? Math.ceil(ctx.needGap - gw + ml) : 0;   // gap between the panes wide enough for the stubs and the trunk
    var M = Math.max(c.pad, c.midMin, wide, Math.ceil(-bb.x + c.pad), Math.ceil(bb.x + bb.width - W + c.pad));
  var cols = "max-content " + (M + c.pagePad) + "px max-content";
  if (Math.abs(M - ml) < 2 && Math.abs(M - mr) < 2 && board.style.gridTemplateColumns === cols) return;
  [board, $("colhd")].forEach(function (el) { el.style.marginLeft = M + "px"; el.style.marginRight = M + "px"; el.style.gridTemplateColumns = cols; });
  fitting++; drawEdges(); fitting--;
}

/* ============================================================================
   10. EVENTS / INIT
   ========================================================================== */
document.addEventListener("click", function (ev) {
  var t = ev.target; if (!(t instanceof Element)) return;
  var b = t.closest("[data-f]");
  if (b) { setFilter(b.getAttribute("data-f")); return; }
  if (t.closest("[data-clear]")) { setSel(null); return; }
  if ((b = t.closest("[data-pf]"))) { var pi = b.getAttribute("data-pi"); setSel(b.getAttribute("data-pf"), pi == null ? null : +pi); return; }
  if ((b = t.closest(".fn .nm"))) {
    var row = b.closest("[data-fn]"), p = row.getAttribute("data-fn"), i = +row.getAttribute("data-i");
    setSel(p, state.sel && state.sel.path === p && state.sel.i === i ? null : i); return;
  }
  if ((b = t.closest(".file[data-path]"))) {
    var p2 = b.getAttribute("data-path");
    setSel(state.sel && state.sel.path === p2 && state.sel.i == null ? null : p2, null); return;
  }
});
var resizeTimer;
window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawEdges, 60); });
function redraw() { requestAnimationFrame(drawEdges); }
if (window.ResizeObserver) new ResizeObserver(redraw).observe($("board"));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
renderLegend(); paneHeaders(); render();
</script>
